name: Bug Report
description: Report a bug in ai-text-hygiene
labels: ["bug"]
body:
  - type: checkboxes
    id: coc
    attributes:
      label: Code of Conduct
      options:
        - label: I agree to follow the [Code of Conduct](https://github.com/michaelinghilterra-creator/ai-text-hygiene/blob/main/CODE_OF_CONDUCT.md)
          required: true
  - type: checkboxes
    id: search
    attributes:
      label: Existing issues
      options:
        - label: I searched existing issues and this hasn't been reported yet
          required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: Minimal input that reproduces it
      description: A short snippet of text (or the exact bytes/codepoints) that triggers the issue. Please don't paste anything sensitive.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected output
      description: What should the cleaned/analyzed output have been?
  - type: input
    id: env
    attributes:
      label: Node.js version and install method
      placeholder: "e.g., Node 20.11, npm install ai-text-hygiene, or CLI"
